<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Garcia do Nascimento — Currículo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <article class="cv" id="inicio">

    <header class="masthead">
      <img src="foto.jpg" alt="Adriano Garcia do Nascimento" class="masthead__photo">
      <div class="masthead__identity">
        <p class="kicker">Currículo profissional</p>
        <h1 class="masthead__name" id="profileName"></h1>
        <p class="masthead__role" id="profileHeadline"></p>
        <p class="masthead__summary" id="heroTagline"></p>
        <ul class="masthead__meta" id="contatoList"></ul>
      </div>
    </header>

    <div class="cv-layout">

      <aside class="sidebar" aria-label="Qualificações">
        <section class="block">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span> Competências</h2>
          <ul class="chip-list" id="skillsList"></ul>
        </section>

        <section class="block">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-screwdriver-wrench"></i></span> Ferramentas</h2>
          <ul class="chip-list" id="toolsList"></ul>
        </section>

        <section class="block">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-language"></i></span> Idiomas</h2>
          <ul id="idiomasList"></ul>
        </section>

        <section class="block">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-graduation-cap"></i></span> Formação</h2>
          <div id="formacaoList"></div>
        </section>
      </aside>

      <div class="main">
        <section class="block" id="sobre">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-id-card"></i></span> Perfil</h2>
          <div class="profile-text" id="aboutText"></div>
        </section>

        <section class="block" id="experiencia">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-briefcase"></i></span> Experiência</h2>
          <div id="experienciaList"></div>
        </section>

        <section class="block" id="projetos">
          <h2 class="block__title"><span class="block__icon" aria-hidden="true"><i class="fa-solid fa-diagram-project"></i></span> Programas e iniciativas</h2>
          <div id="projetosList"></div>
        </section>
      </div>

    </div>

    <footer class="cv-footer">
      <p><span id="footerName"></span> · São Paulo, SP · <span id="currentYear"></span></p>
    </footer>

  </article>

  <script src="script.js"></script>
</body>
</html>
